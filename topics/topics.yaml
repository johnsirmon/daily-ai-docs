# AI Skills Radar — Topics & Sources
# Edit this file to control what the pipeline tracks.
# The command below exercises only the legacy weekly radar.
# Test the daily pipeline with `python -m pipeline.daily prepare --dry-run --no-audio`.

settings:
  lookback_days: 14
  min_stars: 10
  top_n_per_topic: 8
  enrich_stats: true

# Daily podcast control plane. Sources are deliberately curated and public.
# Community popularity is discovery-only; spoken claims require these primary sources.
daily:
  lookback_hours: 36
  max_stories: 3
  # One useful story per canonical product; thin days are allowed to skip.
  max_stories_per_product: 1
  max_youtube_stories: 1
  minimum_score: 75
  minimum_source_health: 0.6
  observer:
    # Offline reviewed packet ingestion only; no workstation path is enabled in production.
    mode: off
    packet_path: null
    allowed_hosts: []
  editorial:
    # Enable only after configuring and verifying a free-tier GEMINI_API_KEY.
    enabled: false
    max_products: 3
    max_events_per_product: 1
    max_research: 1
    minimum_words: 600
    maximum_words: 1100
    max_input_chars: 120000
  sources:
    github_releases:
      - repo: openai/codex
        product: OpenAI Codex
        topic: AI coding agents
        priority: 20
      - repo: anthropics/claude-code
        product: Claude Code
        topic: AI coding agents
        priority: 18
      - repo: google-gemini/gemini-cli
        product: Gemini CLI
        topic: AI coding agents
        priority: 16
      - repo: NousResearch/hermes-agent
        product: Hermes Agent
        topic: AI agents
        priority: 20
      - repo: microsoft/vscode
        product: Visual Studio Code
        topic: Developer environment
        priority: 18
        enrichment:
          enabled: true
          allowed_hosts: [code.visualstudio.com, github.com]
      - repo: microsoft/vscode-copilot-release
        product: GitHub Copilot
        topic: AI coding agents
        priority: 20
      - repo: modelcontextprotocol/specification
        product: Model Context Protocol
        topic: Agent interoperability
        priority: 16
      - repo: agentskills/agentskills
        product: Agent Skills
        topic: Agent interoperability
        priority: 16
    feeds:
      - url: https://github.blog/changelog/feed/
        product: GitHub Developer Tools
        topic: AI coding agents
        priority: 20
        enrichment:
          enabled: true
          allowed_hosts: [github.blog]
        include:
          - copilot
          - visual studio code
          - model context protocol
          - coding agent
        product_rules:
          - product: GitHub Copilot
            include: [copilot]
          - product: Visual Studio Code
            include: [visual studio code, vscode]
          - product: Model Context Protocol
            include: [model context protocol, mcp]
    papers:
      enabled: true
      lookback_days: 30
      max_results: 5
      max_papers: 3
      max_full_text_chars: 60000
      queries:
        - coding agents
        - software engineering agents
        - agent evaluation
        - agent reliability
    youtube:
      enabled: true
      required: false
      digest_path: data/youtube-trends.json
      lookback_days: 8
      max_digest_age_days: 9
      max_video_age_days: 14
      max_results_per_query: 12
      max_selected: 5
      require_transcript: true
      priority: 16
      queries:
        - "AI coding agents developer workflow"
        - "MCP agent development"
        - "Claude Code Codex Gemini CLI"
        - "AI agent evaluation observability"
      primary_domains:
        - anthropic.com
        - developers.googleblog.com
        - github.com
        - microsoft.com
        - modelcontextprotocol.io
        - nousresearch.com
        - openai.com

topics:
  - id: github-copilot
    display: "GitHub Copilot"
    keywords:
      - "github copilot"
      - "copilot agent"
      - "copilot skills"
    pinned_repos:
      - microsoft/vscode-copilot-release

  - id: mcp
    display: "MCP Ecosystem"
    keywords:
      - "model context protocol"
      - "mcp server"
      - "mcp tools"
    pinned_repos:
      - modelcontextprotocol/specification
      - modelcontextprotocol/servers

  - id: agentic-workflows
    display: "Agentic Workflows"
    keywords:
      - "ai agent workflow"
      - "multi-agent"
      - "agent orchestration"
    pinned_repos:
      - microsoft/semantic-kernel
      - BerriAI/litellm

  - id: github-copilot-cli
    display: "GitHub Copilot CLI"
    keywords:
      - "copilot cli"
      - "gh copilot"
      - "github copilot cli"
      - "copilot terminal"
      - "copilot command line"
    pinned_repos:
      - cli/cli

  - id: azure-ai
    display: "Azure AI Foundry"
    keywords:
      - "azure ai foundry"
      - "azure openai"
      - "azure ai studio"
    pinned_repos:
      - microsoft/promptflow

  - id: vscode
    display: "VS Code & AI Extensions"
    keywords:
      - "vscode extension ai"
      - "visual studio code ai"
    pinned_repos:
      - microsoft/vscode
