# AI Skills Radar — Topics & Sources
# Edit this file to control what the pipeline tracks.
# Run `python -m pipeline.main --dry-run` to test locally.

settings:
  lookback_days: 14
  min_stars: 10
  top_n_per_topic: 8
  enrich_stats: true

topics:
  - id: github-copilot
    display: "GitHub Copilot"
    keywords:
      - "github copilot"
      - "copilot agent"
      - "copilot skills"
    pinned_repos:
      - microsoft/vscode-copilot-release

  - id: mcp
    display: "MCP Ecosystem"
    keywords:
      - "model context protocol"
      - "mcp server"
      - "mcp tools"
    pinned_repos:
      - modelcontextprotocol/specification
      - modelcontextprotocol/servers

  - id: agentic-workflows
    display: "Agentic Workflows"
    keywords:
      - "ai agent workflow"
      - "multi-agent"
      - "agent orchestration"
    pinned_repos:
      - microsoft/semantic-kernel
      - BerriAI/litellm

  - id: github-copilot-cli
    display: "GitHub Copilot CLI"
    keywords:
      - "copilot cli"
      - "gh copilot"
      - "github copilot cli"
      - "copilot terminal"
      - "copilot command line"
    pinned_repos:
      - cli/cli

  - id: azure-ai
    display: "Azure AI Foundry"
    keywords:
      - "azure ai foundry"
      - "azure openai"
      - "azure ai studio"
    pinned_repos:
      - microsoft/promptflow

  - id: vscode
    display: "VS Code & AI Extensions"
    keywords:
      - "vscode extension ai"
      - "visual studio code ai"
    pinned_repos:
      - microsoft/vscode
