name: Publish Daily AI Developer Brief

on:
  workflow_dispatch:
    inputs:
      reviewed_episode:
        description: "Reviewed daily release or ad-hoc draft bundle tag; blank for the daily pipeline"
        required: false
        type: string
        default: ""
  schedule:
    # 06:17 EDT / 05:17 EST. Non-top-of-hour reduces scheduler contention.
    - cron: '17 10 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: podcast-publisher
  cancel-in-progress: false

env:
  PODCAST_FEED_URL: https://johnsirmon.github.io/daily-ai-docs/podcast.xml
  PODCAST_MIGRATE_FEED: "1"
  AI_SYNTHESIS: ${{ vars.AI_SYNTHESIS || 'off' }}
  AI_MODEL: ${{ vars.AI_MODEL || 'gpt-5-mini' }}
  AI_EDITORIAL: ${{ vars.AI_EDITORIAL || 'off' }}
  GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
  TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'edge' }}
  PODCAST_AUDIO_POLISH: ${{ vars.PODCAST_AUDIO_POLISH || '0' }}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies and media tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install --requirement requirements.lock

      - name: Run tests and verify canonical feed is provisioned
        run: |
          python -m pytest -q
          python -m pipeline.health --max-age-hours 10000 --retries 3 --delay-seconds 10

      - name: Prepare evidence, narration, and validated audio
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REVIEWED_EPISODE: ${{ inputs.reviewed_episode }}
        run: |
          if [ -n "$REVIEWED_EPISODE" ]; then
            if [[ ! "$REVIEWED_EPISODE" =~ ^daily-[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9][a-z0-9-]{0,80}$ ]] && \
               [[ ! "$REVIEWED_EPISODE" =~ ^adhoc-[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-f0-9]{24}$ ]]; then
              echo "Invalid reviewed episode tag" >&2
              exit 1
            fi
            if [[ "$REVIEWED_EPISODE" == daily-* ]]; then
              gh release view "$REVIEWED_EPISODE" --repo "$GITHUB_REPOSITORY" \
                --json isDraft,isPrerelease --jq '(.isDraft == false) and (.isPrerelease == false)' \
                | grep -qx true
            else
              gh release view "$REVIEWED_EPISODE" --repo "$GITHUB_REPOSITORY" \
                --json isPrerelease --jq '.isPrerelease == false' | grep -qx true
            fi
            gh release download "$REVIEWED_EPISODE" --repo "$GITHUB_REPOSITORY" \
              --pattern daily-ai-brief.mp3 --pattern episode-manifest.json \
              --dir .cache
            python -m pipeline.daily resume-reviewed --episode-id "$REVIEWED_EPISODE" \
              --github-output >> "$GITHUB_OUTPUT"
            if [[ "$REVIEWED_EPISODE" == adhoc-* ]]; then
              python -m pipeline.adhoc verify --directory .cache
            fi
          else
            python -m pipeline.daily prepare --github-output >> "$GITHUB_OUTPUT"
          fi

      - name: Persist skip receipt
        if: steps.prepare.outputs.outcome == 'skipped'
        run: |
          test -f data/runs/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/runs/latest.json
          git diff --cached --quiet || git commit -m "chore: record editorial evaluation"
          git push

      - name: Upload or resume immutable release assets
        if: steps.prepare.outputs.outcome == 'publish'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prepare.outputs.tag }}
          AUDIO_PATH: ${{ steps.prepare.outputs.audio_path }}
          REVIEWED_EPISODE: ${{ inputs.reviewed_episode }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ -n "$REVIEWED_EPISODE" ]; then
              test -s .cache/daily-ai-brief.mp3
              test -s .cache/episode-manifest.json
            else
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern daily-ai-brief.mp3 --pattern episode-manifest.json \
                --dir .cache --clobber
            fi
          else
            gh release create "$TAG" \
              "$AUDIO_PATH#daily-ai-brief.mp3" \
              ".cache/episode-manifest.json#episode-manifest.json" \
              --title "Daily AI Developer Brief ${TAG#daily-}" \
              --notes "Immutable audio and source-backed episode manifest" \
              --repo "$GITHUB_REPOSITORY"
          fi
          if [[ "$TAG" == adhoc-* ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi

      - name: Verify audio and build candidate feed
        if: steps.prepare.outputs.outcome == 'publish'
        run: python -m pipeline.daily finalize --publication .cache/publication.json

      - name: Commit candidate feed and manifest
        if: steps.prepare.outputs.outcome == 'publish'
        env:
          EPISODE_ID: ${{ steps.prepare.outputs.episode_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md podcast.xml "data/episodes/${EPISODE_ID}.json"
          git diff --cached --quiet || git commit -m "feat: publish candidate ${EPISODE_ID}"
          git push

      - name: Build Pages artifact from validated candidate
        if: steps.prepare.outputs.outcome == 'publish'
        run: |
          mkdir -p _site/assets
          cp podcast.xml _site/podcast.xml
          cp assets/podcast-cover*.jpg _site/assets/
          mkdir -p _site/assets/episodes
          for image in assets/episodes/*.jpg; do
            [ -f "$image" ] || continue
            cp "$image" _site/assets/episodes/
          done
          printf '%s\n' 'Daily AI Developer Brief podcast feed' > _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.prepare.outputs.outcome == 'publish'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: steps.prepare.outputs.outcome == 'publish'
        with:
          path: _site
      - name: Deploy candidate to GitHub Pages
        if: steps.prepare.outputs.outcome == 'publish'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Verify subscriber-facing delivery
        if: steps.prepare.outputs.outcome == 'publish'
        env:
          EXPECTED_GUID: ${{ steps.prepare.outputs.episode_id }}
        run: python -m pipeline.health --candidate "data/episodes/${EXPECTED_GUID}.json" --retries 10 --delay-seconds 20

      - name: Confirm publication and advance novelty state
        if: steps.prepare.outputs.outcome == 'publish'
        env:
          EXPECTED_GUID: ${{ steps.prepare.outputs.episode_id }}
        run: python -m pipeline.daily confirm

      - name: Commit publication receipt and state
        if: steps.prepare.outputs.outcome == 'publish'
        env:
          EPISODE_ID: ${{ steps.prepare.outputs.episode_id }}
        run: |
          git add data/state.json data/runs/latest.json "data/episodes/${EPISODE_ID}.json" "data/receipts/${EPISODE_ID}.json"
          if [[ "$EPISODE_ID" == adhoc-* ]]; then
            git add data/requests
          fi
          git diff --cached --quiet || git commit -m "chore: confirm ${EPISODE_ID} delivery"
          git push

      - name: Persist failed editorial run
        if: failure() && env.AI_EDITORIAL == 'required' && !startsWith(inputs.reviewed_episode, 'adhoc-')
        run: |
          python -m pipeline.daily fail-run
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/runs/latest.json
          git diff --cached --quiet || git commit -m "chore: record failed editorial run"
          git push

      - name: Preserve private-safe diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-podcast-${{ github.run_id }}
          path: |
            .cache/episode-manifest.json
            .cache/publication.json
          retention-days: 14
          if-no-files-found: ignore
