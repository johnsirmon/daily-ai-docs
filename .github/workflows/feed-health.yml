name: Podcast Feed Health

on:
  workflow_dispatch:
  schedule:
    - cron: '47 12 * * *'

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --requirement requirements.lock
      - name: Verify public feed freshness
        env:
          PODCAST_FEED_URL: https://johnsirmon.github.io/daily-ai-docs/podcast.xml
        run: python -m pipeline.health --max-age-hours 25 --retries 3 --delay-seconds 20
      - name: Open or update a failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --state open --search 'Podcast feed health failed in:title' --json number --jq '.[0].number // empty')
          body="Daily podcast health failed in workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Podcast feed health failed" --body "$body" --label bug
          fi
