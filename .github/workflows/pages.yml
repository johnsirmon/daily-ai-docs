name: Publish Podcast Feed to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - podcast.xml
      - assets/podcast-cover*.jpg
      - assets/episodes/*.jpg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: podcast-publisher
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build podcast site artifact
        run: |
          mkdir -p _site/assets
          cp podcast.xml _site/podcast.xml
          cp assets/podcast-cover*.jpg _site/assets/
          mkdir -p _site/assets/episodes
          for image in assets/episodes/*.jpg; do
            [ -f "$image" ] || continue
            cp "$image" _site/assets/episodes/
          done
          printf '%s\n' 'Daily AI Developer Brief podcast feed' > _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
