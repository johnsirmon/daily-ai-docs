name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --requirement requirements.lock
      - name: Reject committed Google API keys
        run: |
          if git grep --quiet --extended-regexp 'AIza[0-9A-Za-z_-]{30,}'; then
            echo 'A Google API key pattern was found in a tracked file.' >&2
            exit 1
          fi
      - run: python -m pytest -q
      - run: python -m pipeline.publish_check
