name: Documentation Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml --quiet
      - name: Validate topics config
        run: python -c "import yaml; yaml.safe_load(open('topics/topics.yaml')); print('topics.yaml is valid')"
      - name: Validate requirements
        run: test -f requirements.txt && echo "requirements.txt present"
